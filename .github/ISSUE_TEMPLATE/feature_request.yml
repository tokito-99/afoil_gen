name: Feature request
description: Propose a focused geometry, meshing, workflow, or interoperability improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: CFD or workflow problem
      description: Explain the problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe inputs, outputs, safeguards, and target solver where relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: References or validation evidence
      description: Link primary documentation, papers, or a minimal test case if available.
